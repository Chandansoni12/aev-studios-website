<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="wfGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F15A24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#210D20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plumBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#210D20"/>
      <stop offset="50%" stop-color="#2A1028"/>
      <stop offset="100%" stop-color="#180718"/>
    </linearGradient>
    <linearGradient id="charSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7EF"/>
      <stop offset="100%" stop-color="#EADDCB"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCCBFA"/>
      <stop offset="100%" stop-color="#9C80D8"/>
    </linearGradient>
    <linearGradient id="orangeCyber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="50%" stop-color="#F15A24"/>
      <stop offset="100%" stop-color="#C43B0E"/>
    </linearGradient>
    <linearGradient id="mintBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C6E7C8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C6E7C8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" rx="36" fill="url(#plumBg)"/>
  <circle cx="600" cy="400" r="380" fill="url(#wfGlow)"/>

  <!-- Technical Scallop / Architectural Framing -->
  <g stroke="#FAF7EF" stroke-opacity="0.15" stroke-width="1.5">
    <circle cx="600" cy="400" r="320" fill="none" stroke-dasharray="8 6"/>
    <circle cx="600" cy="400" r="240" fill="none"/>
    <line x1="200" y1="400" x2="1000" y2="400"/>
    <line x1="600" y1="80" x2="600" y2="720"/>
  </g>

  <!-- Left: Futuristic Anime Character (Workflow Architect) -->
  <g transform="translate(240, 260)">
    <!-- Shadow -->
    <ellipse cx="140" cy="420" rx="130" ry="24" fill="#0C040C" opacity="0.6"/>
    <!-- Coat / Body -->
    <path d="M60,280 C60,200 100,160 140,160 C180,160 220,200 220,280 L250,420 L30,420 Z" fill="#191719"/>
    <!-- Collar & Orange Accents -->
    <path d="M110,160 L140,230 L170,160 Z" fill="#F15A24"/>
    <path d="M125,230 L140,280 L155,230 Z" fill="#FAF7EF"/>
    <!-- Neck -->
    <rect x="125" y="125" width="30" height="40" rx="6" fill="url(#charSkin)"/>
    <!-- Face -->
    <path d="M100,80 Q140,150 180,80 Q180,30 140,30 Q100,30 100,80 Z" fill="url(#charSkin)"/>
    <!-- Anime Eye Visor / Cybernetic Glass -->
    <path d="M110,75 L170,75 L165,90 L115,90 Z" fill="#C6E7C8" opacity="0.9"/>
    <line x1="110" y1="82" x2="170" y2="82" stroke="#210D20" stroke-width="2"/>
    <!-- Expressive Anime Hair -->
    <path d="M90,65 Q80,10 135,15 Q180,5 190,55 Q195,90 180,110 Q175,70 160,50 Q130,55 105,75 Z" fill="url(#hairGrad)"/>
    <path d="M95,60 Q115,85 125,115 Q115,90 105,75 Z" fill="#FAF7EF" opacity="0.6"/>
    <!-- Reaching Cybernetic Hands interacting with floating node -->
    <path d="M210,260 Q270,240 310,220" stroke="#F15A24" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="320" cy="215" r="14" fill="#C6E7C8"/>
  </g>

  <!-- Right: Dynamic Workflow Node Network & Autonomous Nodes -->
  <g transform="translate(680, 240)">
    <!-- Central Automation Sphere -->
    <circle cx="180" cy="160" r="90" fill="#191719" stroke="#F15A24" stroke-width="3"/>
    <circle cx="180" cy="160" r="70" fill="url(#orangeCyber)" opacity="0.85"/>
    <polygon points="180,110 215,145 200,195 160,195 145,145" fill="#FAF7EF"/>
    <circle cx="180" cy="155" r="12" fill="#210D20"/>

    <!-- Orbital Workflow Nodes -->
    <!-- Node 1: Webhook -->
    <g transform="translate(40, 20)">
      <circle cx="0" cy="0" r="38" fill="#191719" stroke="#C6E7C8" stroke-width="2.5"/>
      <path d="M-15,-8 L0,12 L15,-8" fill="none" stroke="#C6E7C8" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="52" text-anchor="middle" fill="#C6E7C8" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">WEBHOOK</text>
    </g>
    <!-- Node 2: Logic Router -->
    <g transform="translate(320, 40)">
      <circle cx="0" cy="0" r="42" fill="#191719" stroke="#DCCBFA" stroke-width="2.5"/>
      <polygon points="0,-18 16,14 -16,14" fill="#DCCBFA"/>
      <text x="0" y="58" text-anchor="middle" fill="#DCCBFA" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">AI AGENT</text>
    </g>
    <!-- Node 3: Database Sync -->
    <g transform="translate(290, 290)">
      <circle cx="0" cy="0" r="40" fill="#191719" stroke="#F15A24" stroke-width="2.5"/>
      <ellipse cx="0" cy="-10" rx="18" ry="7" fill="none" stroke="#FAF7EF" stroke-width="2.5"/>
      <path d="M-18,-10 L-18,10 C-18,15 18,15 18,10 L18,-10" fill="none" stroke="#FAF7EF" stroke-width="2.5"/>
      <text x="0" y="54" text-anchor="middle" fill="#F15A24" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">DATA SYNC</text>
    </g>
    <!-- Node 4: Output Trigger -->
    <g transform="translate(30, 270)">
      <circle cx="0" cy="0" r="36" fill="#191719" stroke="#FAF7EF" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="14" fill="#F15A24"/>
      <text x="0" y="50" text-anchor="middle" fill="#FAF7EF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">TRIGGER</text>
    </g>

    <!-- Connective Energy Beams -->
    <line x1="40" y1="20" x2="130" y2="110" stroke="#C6E7C8" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="320" y1="40" x2="235" y2="120" stroke="#DCCBFA" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="290" y1="290" x2="230" y2="205" stroke="#F15A24" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="30" y1="270" x2="120" y2="195" stroke="#FAF7EF" stroke-width="3" stroke-dasharray="6 4"/>
  </g>

  <!-- Editorial Badge Bottom -->
  <g transform="translate(600, 720)">
    <rect x="-220" y="-24" width="440" height="48" rx="24" fill="#191719" stroke="#F15A24" stroke-width="1.5"/>
    <circle cx="-185" cy="0" r="7" fill="#C6E7C8"/>
    <text x="-165" y="6" fill="#FAF7EF" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" letter-spacing="3">AUTONOMOUS ENGINE · 24/7 ACTIVE</text>
  </g>
</svg>