<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="lavGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCCBFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#210D20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lavBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26102B"/>
      <stop offset="50%" stop-color="#36153E"/>
      <stop offset="100%" stop-color="#1B0920"/>
    </linearGradient>
    <linearGradient id="fluidWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F15A24"/>
      <stop offset="50%" stop-color="#DCCBFA"/>
      <stop offset="100%" stop-color="#C6E7C8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" rx="36" fill="url(#lavBg)"/>
  <circle cx="600" cy="400" r="380" fill="url(#lavGlow)"/>

  <!-- Left: Floating Holographic Glass Browser Viewport -->
  <g transform="translate(240, 220)">
    <!-- Browser Shadow -->
    <rect x="15" y="15" width="460" height="340" rx="24" fill="#0C040C" opacity="0.6"/>
    <!-- Outer Glass Frame -->
    <rect width="460" height="340" rx="24" fill="#1B0B20" stroke="#DCCBFA" stroke-width="2.5"/>
    
    <!-- Window Bar -->
    <rect width="460" height="44" rx="24" fill="#291130"/>
    <rect y="25" width="460" height="19" fill="#291130"/>
    <circle cx="28" cy="22" r="6" fill="#F15A24"/>
    <circle cx="48" cy="22" r="6" fill="#DCCBFA"/>
    <circle cx="68" cy="22" r="6" fill="#C6E7C8"/>
    <!-- Search Bar -->
    <rect x="95" y="10" width="270" height="24" rx="12" fill="#18071C"/>
    <text x="230" y="26" text-anchor="middle" fill="#FAF7EF" opacity="0.8" font-family="'Space Grotesk', sans-serif" font-size="11">aevstudios.com/experience</text>

    <!-- Inside Content: 60 FPS Interactive Hero Section Preview -->
    <g transform="translate(30, 70)">
      <rect width="140" height="14" rx="7" fill="#F15A24"/>
      <text x="0" y="45" fill="#FAF7EF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="22">NEXT.JS REACT 19</text>
      <text x="0" y="70" fill="#DCCBFA" font-size="13">Ultra-fast sub-second hydration</text>

      <!-- Interactive 3D Component Card Inside Viewport -->
      <g transform="translate(0, 95)">
        <rect width="400" height="135" rx="16" fill="#291232" stroke="#FAF7EF" stroke-opacity="0.2" stroke-width="1.5"/>
        <circle cx="45" cy="50" r="25" fill="#F15A24"/>
        <text x="85" y="44" fill="#FAF7EF" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="16">Framer Motion System</text>
        <text x="85" y="65" fill="#C6E7C8" font-family="monospace" font-size="12">SPEED INDEX: 0.4s · 100/100</text>
        <!-- Motion Speed Indicator -->
        <rect x="85" y="85" width="280" height="8" rx="4" fill="#18071C"/>
        <rect x="85" y="85" width="260" height="8" rx="4" fill="url(#fluidWave)"/>
      </g>
    </g>
  </g>

  <!-- Right: Anime Digital Artisan Character Sculpting Motion -->
  <g transform="translate(820, 240)">
    <!-- Shadow -->
    <ellipse cx="110" cy="440" rx="120" ry="22" fill="#0C040C" opacity="0.6"/>
    <!-- Coat / Body -->
    <path d="M40,290 C40,210 75,170 110,170 C145,170 180,210 180,290 L210,440 L10,440 Z" fill="#191719"/>
    <!-- Lavender Collar -->
    <path d="M85,170 L110,240 L135,170 Z" fill="#DCCBFA"/>
    <!-- Head -->
    <rect x="95" y="130" width="30" height="45" rx="6" fill="#FAF7EF"/>
    <path d="M75,90 Q110,155 145,90 Q145,40 110,40 Q75,40 75,90 Z" fill="#FAF7EF"/>
    <!-- Hair -->
    <path d="M65,75 Q55,20 105,25 Q145,15 155,65 Q160,100 145,120 Q140,80 125,60 Q95,65 75,85 Z" fill="#F15A24"/>
    <!-- Sculpting Cybernetic Hand with Motion Ribbon -->
    <path d="M60,270 Q-40,230 -110,210" stroke="url(#fluidWave)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="-115" cy="208" r="14" fill="#DCCBFA"/>
  </g>

  <!-- Editorial Ribbon Bottom -->
  <g transform="translate(600, 720)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#191719" stroke="#DCCBFA" stroke-width="1.5"/>
    <circle cx="-205" cy="0" r="7" fill="#C6E7C8"/>
    <text x="-185" y="6" fill="#FAF7EF" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" letter-spacing="3">FRAMER-GRADE MOTION · IMMERSIVE UX</text>
  </g>
</svg>