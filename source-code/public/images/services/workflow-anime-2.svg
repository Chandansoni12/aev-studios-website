<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#210D20"/>
      <stop offset="100%" stop-color="#140614"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#docGrad)"/>
  <!-- Holographic Isometric Document Cascade -->
  <g transform="translate(600, 360)">
    <!-- Back card -->
    <rect x="-240" y="-180" width="380" height="240" rx="20" fill="#2d132c" stroke="#DCCBFA" stroke-width="2" opacity="0.5" transform="rotate(-6)"/>
    <!-- Middle card -->
    <rect x="-210" y="-150" width="400" height="260" rx="20" fill="#1f0920" stroke="#C6E7C8" stroke-width="2.5" opacity="0.8" transform="rotate(3)"/>
    <!-- Front card -->
    <rect x="-180" y="-120" width="420" height="280" rx="24" fill="#191719" stroke="#F15A24" stroke-width="3"/>
    
    <!-- Card Code / Diagram Content -->
    <rect x="-140" y="-80" width="180" height="16" rx="8" fill="#F15A24"/>
    <rect x="-140" y="-45" width="320" height="10" rx="5" fill="#FAF7EF" opacity="0.5"/>
    <rect x="-140" y="-20" width="280" height="10" rx="5" fill="#FAF7EF" opacity="0.5"/>
    <rect x="-140" y="5" width="300" height="10" rx="5" fill="#FAF7EF" opacity="0.5"/>
    <rect x="-140" y="45" width="140" height="40" rx="12" fill="#C6E7C8"/>
    <text x="-70" y="70" text-anchor="middle" fill="#210D20" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="13">PARSED: 100%</text>

    <!-- Floating AI Sparkles -->
    <polygon points="170,-90 178,-70 198,-62 178,-54 170,-34 162,-54 142,-62 162,-70" fill="#DCCBFA"/>
    <polygon points="-120,130 -114,145 -99,151 -114,157 -120,172 -126,157 -141,151 -126,145" fill="#F15A24"/>
  </g>
  <text x="600" y="710" text-anchor="middle" fill="#FAF7EF" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="16" letter-spacing="4">INTELLIGENT UNSTRUCTURED DATA SYNTHESIS</text>
</svg>