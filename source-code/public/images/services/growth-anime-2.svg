<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="pipeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173428"/>
      <stop offset="100%" stop-color="#0B1A13"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#pipeBg)"/>
  <g transform="translate(600, 370)">
    <!-- Concentric Data Pipeline Rings -->
    <circle r="220" fill="none" stroke="#C6E7C8" stroke-width="2" stroke-dasharray="14 10" opacity="0.6"/>
    <circle r="160" fill="none" stroke="#FAF7EF" stroke-width="2" opacity="0.3"/>
    <circle r="100" fill="#0C1F17" stroke="#C6E7C8" stroke-width="3"/>
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#C6E7C8"/>
    <circle r="12" fill="#11241C"/>

    <!-- Orbital Tool Badges -->
    <g transform="translate(-160, -90)"><circle r="30" fill="#0A1813" stroke="#F15A24" stroke-width="2"/><text y="6" text-anchor="middle" fill="#FAF7EF" font-weight="900" font-size="14">API</text></g>
    <g transform="translate(160, -90)"><circle r="30" fill="#0A1813" stroke="#DCCBFA" stroke-width="2"/><text y="6" text-anchor="middle" fill="#FAF7EF" font-weight="900" font-size="14">BI</text></g>
    <g transform="translate(0, 180)"><circle r="30" fill="#0A1813" stroke="#C6E7C8" stroke-width="2"/><text y="6" text-anchor="middle" fill="#FAF7EF" font-weight="900" font-size="14">ERP</text></g>
  </g>
  <text x="600" y="705" text-anchor="middle" fill="#C6E7C8" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="16" letter-spacing="4">REAL-TIME MULTI-SYSTEM DATA FABRIC</text>
</svg>